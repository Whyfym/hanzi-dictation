function parse(t){
  const out=[],bad=[],sent=[];let lesson="Lesson 1";
  t.split(/\r?\n/).forEach((raw,i)=>{
    const l=raw.trim();if(!l)return;
    if(/^\[S\]/i.test(l)){const c=l.replace(/^\[S\]\s*/i,"").split(l.includes("|")?"|":"\t").map(x=>x.trim());const t=(c[0]||"").split(/\s+/).filter(Boolean);

    if(l[0]=="#"){lesson=l.replace(/^#+\s*/,"")||lesson;return}
    const c=l.split(l.includes("|")?"|":"\t").map(x=>x.trim());
    if(c.length<3||!CJK.test(c[0])||!c[1]||!c[2]){bad.push("Line "+(i+1)+": "+l);return}
    out.push({h:c[0],p:c[1],m:c.slice(2).join(" | "),l:lesson});
  });
  return{out,bad,sent};
}

const setTheme=v=>{THEME=v;try{localStorage.setItem("zw-theme",v)}catch(x){}if(v=="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=v};
function langSel(){return `<span class="sels"><select id="th" aria-label="Theme">${THEMES.map(([c,n])=>`<option value="${c}" ${c==THEME?"selected":""}>${n}</option>`).join("")}</select><select id="lg" aria-label="Language">${LANGS.map(([c,n])=>`<option value="${c}" ${c==LANG?"selected":""}>${n}</option>`).join("")}</select></span>`}
function bindLang(){const h=$("#th");if(h)h.onchange=()=>setTheme(h.value);const e=$("#lg");if(e)e.onchange=()=>{LANG=e.value;try{localStorage.setItem("zw-lang",LANG)}catch(x){}document.documentElement.lang=LANG;route()}}
const feats=()=>[["词",t("Your own word lists"),t("Upload a TXT file with hanzi, pinyin and meanings in any language.")],["听",t("Dictation"),t("Hear it, write on paper")],["写",t("Write on screen"),t("Draw each stroke")],["选",t("Meaning quiz"),t("Pick, then confirm")],["排",t("Arrange sentence"),t("Put words in order")],["赛",t("Live rooms"),t("Host a room code and compete with classmates on speed and accuracy.")],["印",t("Print a test sheet with answer key"),""]];
function login(){
  onLogin=true;const up=authTab=="up";
  app.innerHTML=`<header class="top"><div class="brand"><span class="seal">中</span><b>Zhongwenfy</b></div>${langSel()}</header>
  <main class="gate"><section class="hero"><div class="tzg big" aria-hidden="true"><span>中</span></div><h1>Zhongwenfy</h1><p class="lead">${t("Learn to write hanzi from your own word lists")}</p></section>
  <section class="card auth"><div class="tabs"><button class="tab ${up?"":"on"}" data-tab="in">${t("Sign in")}</button><button class="tab ${up?"on":""}" data-tab="up">${t("Create account")}</button></div>
  <form id="af" novalidate>
  <label>${t("Email")}<input id="ae" type="email" autocomplete="email"></label>
  <label>${t("Password")}<input id="ap" type="password" autocomplete="${up?"new-password":"current-password"}"></label>
  <button id="as" type="submit" style="width:100%">${up?t("Create account"):t("Sign in")}</button></form>
  <div id="ge" role="alert"></div><div class="or"><span>${t("or")}</span></div>
  <button class="gbtn" id="gl">${GSVG}${t("Continue with Google")}</button><button class="link" id="gg">${t("Continue as guest")}</button>
  <p class="fine">${t("Guest data stays on this device.")}</p></section></main>
  <section class="feats"><h2>${t("What you can do")}</h2><div class="fgrid">${feats().map(f=>`<div class="feat"><i>${f[0]}</i><b>${f[1]}</b>${f[2]?`<span>${f[2]}</span>`:""}</div>`).join("")}</div></section>`;
  bindLang();
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{authTab=b.dataset.tab;login()});
  $("#af").onsubmit=async e=>{
    e.preventDefault();const g=$("#ge"),em=$("#ae").value.trim(),pw=$("#ap").value;g.textContent="";
    if(!SB){g.textContent="The sign-in library did not load. Check your connection.";return}
    if(!em||pw.length<6){g.textContent=t("Password needs at least 6 characters.");return}
    const b=$("#as");b.disabled=true;
    if(up){
      const{data,error}=await SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
      b.disabled=false;
      if(error){g.textContent=error.message;return}
      if(!data.session)g.textContent=t("Check your email to confirm your account, then sign in.");
    }else{
      const{error}=await SB.auth.signInWithPassword({email:em,password:pw});b.disabled=false;
      if(error)g.textContent=/invalid/i.test(error.message)?t("Wrong email or password. No account yet? Create one first."):error.message;
    }};
  $("#gl").onclick=async()=>{
    if(!SB){$("#ge").textContent="The sign-in library did not load. Check your connection.";return}
    const{error}=await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
    if(error)$("#ge").textContent="Google sign-in is not ready yet: "+error.message};
  $("#gg").onclick=()=>{setGuest(true);home()};
}

const uname=()=>(user&&user.user_metadata&&user.user_metadata.username)||"";
const NAMEOK=/^[\p{L}\p{N}_ .-]{2,14}$/u;
function nameSetup(){
  app.innerHTML=`<header class="top"><div class="brand"><span class="seal">中</span><b>Zhongwenfy</b></div>${langSel()}</header>
  <section class="card"><h2>${t("Choose a username")}</h2><p class="hint">${t("This name appears in game rooms and on the leaderboard. You only need to do this once.")}</p>
  <form id="nf" novalidate><label style="display:grid;gap:4px;margin-top:14px;font-weight:700;font-size:14px">${t("Username")}<input id="un" maxlength="14" autocomplete="nickname"></label>
  <div id="ne" role="alert" style="color:var(--bad);font-size:13.5px;min-height:1.3em;margin-top:6px"></div>
  <div class="row"><button type="submit" id="ns">${t("Save")}</button><button type="button" class="ghost" id="no">${t("Sign out")}</button></div></form></section>`;
  bindLang();
  $("#no").onclick=async()=>{setGuest(false);await SB.auth.signOut()};
  $("#nf").onsubmit=async e=>{
    e.preventDefault();const v=$("#un").value.trim();
    if(!NAMEOK.test(v)){$("#ne").textContent=t("Use 2 to 14 letters, numbers, spaces, or _ . -");return}
    $("#ns").disabled=true;
    const{data,error}=await SB.auth.updateUser({data:{username:v}});
    $("#ns").disabled=false;
    if(error){$("#ne").textContent=error.message;return}
    user=data.user;home()};
}
function profile(){
  const md=user.user_metadata||{},s=window.xStats?xStats():{streak:0,goal:10,today:0,due:0,learned:0,mastered:0,acc:0,total:0},loc=LANG=="zh"?"zh-CN":LANG;
  const fd=x=>x?new Date(x).toLocaleDateString(loc,{year:"numeric",month:"long",day:"numeric"}):"-";
  const prov=(user.app_metadata&&user.app_metadata.provider)||"email";
  const av=md.avatar_url?`<img class="pfimg" src="${esc(md.avatar_url)}" alt="" referrerpolicy="no-referrer">`:`<span class="pfimg av"></span>`;
  const c=(v,l)=>`<div><b>${v}</b><span>${t(l)}</span></div>`;
  app.innerHTML=`<header class="top"><button class="ghost sm" id="bk">${t("Back")}</button><b>${t("My profile")}</b>${langSel()}</header>
  <section class="card"><div class="pfhead">${av}<div><h2 style="font-size:1.4rem">${esc(uname())}</h2><div class="hint">${esc(user.email||"")}</div><div class="hint">${t("Sign-in method")}: ${prov=="google"?"Google":t("Email")}</div></div></div>
  <div class="stats" style="margin-top:16px">${c(s.streak,"Day streak")}${c(s.today+"/"+s.goal,"Daily goal")}${c(s.due,"Due for review")}</div>
  <div class="stats">${c(s.learned,"Words learned")}${c(s.mastered,"Mastered")}${c(s.acc+"%","Accuracy")}</div>
  <div class="stats">${c(s.total,"Answers")}<div><b id="wk">-</b><span>${t("Points this week")}</span></div><div><b style="font-size:1rem">${esc(fd(user.created_at))}</b><span>${t("Joined")}</span></div></div>
  <p class="hint">${t("Last sign-in")}: ${esc(fd(user.last_sign_in_at))}</p>
  <h3>${t("Edit username")}</h3><form id="uf" novalidate><div class="row" style="margin-top:0"><input id="un" maxlength="14" value="${esc(uname())}"><button type="submit">${t("Save")}</button></div><div id="ue" role="status" class="hint" style="min-height:1.3em;margin-top:6px"></div></form>
  <div class="row"><button class="ghost" id="po">${t("Sign out")}</button></div></section>`;
  bindLang();
  $("#bk").onclick=home;
  $("#po").onclick=async()=>{setGuest(false);await SB.auth.signOut()};
  $("#uf").onsubmit=async e=>{
    e.preventDefault();const v=$("#un").value.trim(),m=$("#ue");
    if(!NAMEOK.test(v)){m.textContent=t("Use 2 to 14 letters, numbers, spaces, or _ . -");return}
    const{data,error}=await SB.auth.updateUser({data:{username:v}});
    if(error){m.textContent=error.message;return}
    user=data.user;document.querySelector(".pfhead h2").textContent=v;m.textContent=t("Saved.")};
  if(window.xWeek)xWeek().then(n=>{const e=$("#wk");if(e)e.textContent=n});
}
function home(){
  onLogin=false;
  if(user&&!uname()){nameSetup();return}
  const ls=[...new Set([...deck,...sents].map(w=>w.l))],has=deck.length||sents.length,md=user&&user.user_metadata||{};
  const who=user?`<div class="who"><button class="pfb" id="pf">${md.avatar_url?`<img src="${esc(md.avatar_url)}" alt="" referrerpolicy="no-referrer">`:`<span class="av"></span>`}<span class="nm">${esc(displayName())}</span></button><button class="ghost sm" id="so">${t("Sign out")}</button></div>`:`<div class="who"><span class="nm hint">${guest?t("Guest"):""}</span><button class="ghost sm" id="si">${t("Sign in")}</button></div>`;
  app.innerHTML=`<header class="top"><div class="brand"><span class="seal">中</span><b>Zhongwenfy</b></div><div class="who">${langSel()}${who}</div></header>
  <div class="grid${has?"":" nodeck"}"><div class="col">
  <section class="card c-words"><h2>${t("Your word list")}</h2><p class="hint" style="margin:0">${t("Paste your class vocabulary or open a TXT file.")}</p>
  <textarea id="txt" rows="6" placeholder="# Lesson 1&#10;你好 | nǐ hǎo | hello"></textarea>
  <div class="row"><input type="file" id="file" accept=".txt,text/plain"><button id="load">${t("Load words")}</button><button class="ghost" id="sample">${t("Try a sample")}</button></div>
  <div id="msg" aria-live="polite"></div>
  <details><summary>${t("File format")}</summary><pre># Lesson title (optional)\nhanzi | pinyin | meaning\n你好 | nǐ hǎo | hello\n[S] 我 喜欢 学 中文 | wǒ xǐhuan xué zhōngwén | I like studying Chinese</pre><p class="hint">One word per line. Separate with | or a tab. Write the meaning in any language you like. Lines starting with [S] are sentences for the arrange game: put spaces between the words.</p></details></section>
  ${has?`<section class="card c-less"><h2>${t("Lessons")}</h2><p class="hint" style="margin:0 0 6px">${t("{0} words, {1} sentences",deck.length,sents.length)}</p>${ls.map((l,i)=>`<label class="ls"><input type="checkbox" data-l="${i}" ${sel.has(l)?"checked":""}><span>${esc(l)}</span><span class="hint" style="margin-left:auto">${t("{0} words, {1} sentences",deck.filter(w=>w.l==l).length,sents.filter(w=>w.l==l).length)}</span></label>`).join("")}
  <div class="row"><label>${t("Words per round")} <input type="number" id="cnt" min="1" max="200" value="10" style="width:76px"></label><button class="ghost" id="clr">${t("Remove list")}</button></div></section>`:""}
  </div><div class="col">${window.xToday?xToday():""}
  ${has?`<section class="card c-prac"><h2>${t("Practise")}</h2><div class="tiles">
  <button class="tile" data-m="dict"><i>听</i><b>${t("Dictation")}</b><span>${t("Hear it, write on paper")}</span></button>
  <button class="tile" data-m="write"><i>写</i><b>${t("Write on screen")}</b><span>${t("Draw each stroke")}</span></button>
  <button class="tile" data-m="quiz"><i>选</i><b>${t("Meaning quiz")}</b><span>${t("Pick, then confirm")}</span></button>
  <button class="tile" data-m="arr"><i>排</i><b>${t("Arrange sentence")}</b><span>${t("Put words in order")}</span></button></div>
  <div class="row"><button class="ghost" id="pr">${t("Print a test sheet with answer key")}</button></div></section>`:`<section class="card c-prac"><h2>${t("Start with a word list")}</h2><p class="hint">${t("Paste your vocabulary on the left, or try the sample to look around.")}</p></section>`}
  ${window.mpCard?mpCard():""}</div></div>`;
  const load=txt=>{const{out,bad,sent}=parse(txt);const m=$("#msg");
    if(!out.length&&!sent.length){m.innerHTML=`<span class="e">${t("No valid words found. Check the file format.")}</span>`;return}
    deck=out;sents=sent;sel=new Set([...out,...sent].map(w=>w.l));save();home();
    if(bad.length)$("#msg").innerHTML=`<span class="e">${bad.length} line(s) skipped:<br>${bad.slice(0,5).map(esc).join(`<br>`)}</span>`;};
  $("#load").onclick=()=>load($("#txt").value);
  $("#sample").onclick=()=>load(SAMPLE);
  $("#file").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(load)};
  if(window.mpBind)mpBind();
  if(window.xBind)xBind();
  if(has){
    app.querySelectorAll("[data-l]").forEach(c=>c.onchange=()=>{const l=ls[+c.dataset.l];c.checked?sel.add(l):sel.delete(l);save()});
    $("#clr").onclick=()=>{deck=[];sents=[];sel=new Set();save();home()};
    $("#pr").onclick=printSheet;
    app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
      const a=b.dataset.m=="arr",q=(window.xPick||((p,n)=>shuf(p).slice(0,n)))((a?sents:deck).filter(w=>sel.has(w.l)),+$("#cnt").value||10);
      if(!q.length){alert(a?t("Select at least one lesson that has sentences."):t("Select at least one lesson that has words."));return}
      run(b.dataset.m,q)});
  }
  bindLang();
  const pf=$("#pf");if(pf)pf.onclick=profile;
  const so=$("#so");if(so)so.onclick=async()=>{setGuest(false);await SB.auth.signOut()};
  const si=$("#si");if(si)si.onclick=()=>{setGuest(false);login()};
}

function run(mode,q){R={mode,q,i:0,res:[],t:0};step()}
function step(){if(R.i>=R.q.length)return done();R.t=Date.now();({dict,write,quiz,arr})[R.mode](R.q[R.i])}
function rec(ok,miss){if(window.xRec)xRec(R.q[R.i],ok);R.res.push({w:R.q[R.i],ok,ms:Date.now()-R.t,miss});R.i++;step()}
function frame(inner){
  app.innerHTML=`<div class="bar"><button class="ghost" id="quit">${t("Quit")}</button><span>${R.i+1} / ${R.q.length}</span><div class="prog"><i style="width:${R.i/R.q.length*100}%"></i></div></div><section class="card q">${inner}</section>`;
  $("#quit").onclick=home;
}

function dict(w){
  frame(`<p class="py">${esc(w.p)}</p><p class="mn">${esc(w.m)}</p><div class="row"><button class="ghost" id="ls">${t("Listen")}</button></div><div id="ans" class="row"><button id="rv">${t("Reveal answer")}</button></div><p class="hint">${t("Write it on paper first, then reveal.")}</p>`);
  $("#ls").onclick=()=>say(w.h);
  $("#rv").onclick=()=>{$("#ans").outerHTML=`<div class="hz">${esc(w.h)}</div><div class="row"><button class="ok" id="y">${t("I wrote it right")}</button><button class="bad" id="n">${t("I missed it")}</button></div>`;$("#y").onclick=()=>rec(1);$("#n").onclick=()=>rec(0)};
}

function write(w){
  const chars=[...w.h].filter(c=>CJK.test(c)),cols=Math.min(chars.length||1,chars.length>4?3:2),sz=Math.max(90,Math.min(220,Math.floor((Math.min(innerWidth,640)-72-10*(cols-1))/cols)));
  frame(`<p class="py">${esc(w.p)}</p><p class="mn">${esc(w.m)}</p><div class="boxes" id="bx"></div><p id="st" class="hint">${t("Write each stroke. Up to {0} wrong strokes still count as correct; giving up counts as wrong.",MAX_MISS)}</p><div class="row" id="ctl"><button class="ghost" id="ls">${t("Listen")}</button><button class="ghost" id="hn">${t("Hint")}</button><button class="ghost" id="sa">${t("Show answer")}</button></div>`);
  $("#ls").onclick=()=>say(w.h);
  let miss=0,fbk=false,W=[];
  const fallback=()=>{if(fbk)return;fbk=true;$("#bx").innerHTML="";$("#st").textContent="Stroke data is unavailable for this word, so check yourself on paper.";
    $("#ctl").innerHTML=`<button class="ghost" id="rv">${t("Reveal answer")}</button>`;
    $("#rv").onclick=()=>{$("#bx").innerHTML=`<div class="hz">${esc(w.h)}</div>`;$("#ctl").innerHTML=`<button class="ok" id="y">${t("I wrote it right")}</button><button class="bad" id="n">${t("I missed it")}</button>`;$("#y").onclick=()=>rec(1);$("#n").onclick=()=>rec(0)}};
  if(typeof HanziWriter=="undefined"||!chars.length)return fallback();
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
  chars.forEach(c=>{const d=document.createElement("div");d.className="tzg";$("#bx").append(d);
    W.push(HanziWriter.create(d,c,{width:sz,height:sz,padding:12,showCharacter:false,showOutline:false,strokeColor:ink,drawingColor:ink,highlightColor:"#c0222f",leniency:1.3,onLoadCharDataError:fallback}))});
  const go=k=>W[k].quiz({onMistake:()=>{miss++},onComplete:()=>{
    if(fbk)return;
    if(k+1<W.length)return go(k+1);
    const ok=miss<=MAX_MISS;
    $("#st").textContent=(miss?t("Finished with {0} wrong strokes.",miss):t("Perfect, no wrong strokes."))+" "+(ok?t("Counted as correct."):t("Counted as wrong."));
    $("#ctl").innerHTML=`<button id="nx">${t("Next")}</button>`;$("#nx").onclick=()=>rec(ok,miss)}});
  go(0);
  $("#hn").onclick=()=>{if(fbk)return;W.forEach(x=>x.showOutline());setTimeout(()=>W.forEach(x=>x.hideOutline()),1500)};
  $("#sa").onclick=()=>{if(fbk)return;W.forEach(x=>{x.cancelQuiz();x.showCharacter()});$("#st").textContent=t("You gave up, so this counts as wrong.");$("#ctl").innerHTML=`<button id="nx">${t("Next")}</button>`;$("#nx").onclick=()=>rec(0,miss)};
}

function quiz(w){
  const o=shuf([w,...shuf(deck.filter(x=>x.m!==w.m)).slice(0,3)]);let pick=-1;
  frame(`<div class="hz">${esc(w.h)}</div><p class="py">${esc(w.p)}</p><div class="opts">${o.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x.m)}</button>`).join("")}</div><div class="row"><button id="cf" disabled>${t("Confirm answer")}</button></div>`);
  const bs=[...app.querySelectorAll(".opt")];
  bs.forEach(b=>b.onclick=()=>{if(b.disabled)return;pick=+b.dataset.i;bs.forEach(x=>x.classList.toggle("on",x==b));$("#cf").disabled=false});
  $("#cf").onclick=()=>{const ok=o[pick]===w;bs.forEach((b,i)=>{b.disabled=true;if(o[i]===w)b.classList.add("right");else if(i==pick)b.classList.add("wrong")});
    const c=$("#cf");c.textContent=t("Next");c.onclick=()=>rec(ok)};
}

function arr(w){
  const ord=[],toks=shuf(w.t);
  frame(`<p class="mn">${esc(w.m)}</p><p class="py">${esc(w.p)}</p><div class="boxes" id="ar" style="min-height:56px;border-bottom:2px solid var(--line)"></div><div class="boxes" id="pool"></div><div class="row" id="ctl"><button id="cf" disabled>${t("Confirm answer")}</button></div>`);
  const draw=()=>{
    $("#ar").innerHTML=ord.map((k,j)=>`<button class="ghost hz-s" data-r="${j}">${esc(toks[k])}</button>`).join("");
    $("#pool").innerHTML=toks.map((x,k)=>ord.includes(k)?"":`<button class="ghost hz-s" data-k="${k}">${esc(x)}</button>`).join("");
    $("#cf").disabled=ord.length!=toks.length;
    app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ord.splice(+b.dataset.r,1);draw()});
    app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ord.push(+b.dataset.k);draw()});
  };
  draw();
  $("#cf").onclick=()=>{const ok=ord.map(k=>toks[k]).join("")==w.t.join("");
    $("#pool").innerHTML=`<p class="${ok?"":"hint"}">${ok?t("Correct."):t("Not quite. Correct order:")+" "+esc(w.t.join(" "))}</p>`;
    $("#ctl").innerHTML=`<button id="nx">${t("Next")}</button>`;$("#nx").onclick=()=>rec(ok?1:0)};
}

function printSheet(){
  const q=shuf(deck.filter(w=>sel.has(w.l))).slice(0,+$("#cnt").value||10);
  if(!q.length){alert(t("Select at least one lesson that has words."));return}
  const sh=document.createElement("div");sh.id="sheet";
  sh.innerHTML=`<h2>${t("Dictation test")}</h2><p>${t("Name")}: ______________________ ${t("Date")}: ______________</p><ol>${q.map(w=>`<li><b>${esc(w.p)}</b> &nbsp; ${esc(w.m)}<div class="wb"></div></li>`).join("")}</ol><div style="page-break-before:always"></div><h2>${t("Answer key")}</h2><ol>${q.map(w=>`<li><span style="font:1.3rem var(--hz)">${esc(w.h)}</span> &nbsp; ${esc(w.p)} &nbsp; ${esc(w.m)}</li>`).join("")}</ol>`;
  document.body.append(sh);
  window.onafterprint=()=>{sh.remove();window.onafterprint=null};
  window.print();
}

function done(){
  const ok=R.res.filter(r=>r.ok).length,miss=R.res.filter(r=>!r.ok).map(r=>r.w);
  const avg=(R.res.reduce((a,r)=>a+r.ms,0)/R.res.length/1000).toFixed(1);
  app.innerHTML=`<section class="card"><h2>${t("Result")}</h2><p class="score">${ok} / ${R.res.length}</p><p class="hint">${t("Average {0} seconds per word",avg)}</p>
  ${R.mode=="write"?`<p class="hint">Wrong strokes per word: ${R.res.map(r=>esc(r.w.h)+" "+(r.miss==null?"-":r.miss)).join(", ")}</p>`:""}
  ${miss.length?`<h3>${t("Words to review")}</h3><ul class="miss">${miss.map(w=>`<li><span class="hz-s">${esc(w.h)}</span><span>${esc(w.p)}</span><span class="hint">${esc(w.m)}</span></li>`).join("")}</ul>`:`<p>${t("No missed words.")}</p>`}
  <div class="row">${miss.length?`<button id="rt">${t("Practise missed words")}</button>`:""}<button class="ghost" id="hm">${t("Back to start")}</button></div></section>`;
  if(miss.length)$("#rt").onclick=()=>run(R.mode,shuf(miss));
  $("#hm").onclick=home;
}
boot();
</script>
</body>
